name: Build Browser Test (Chrome)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Chrome (open source license)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version-file: '.nvmrc'
      - name: Print environment
        run: |
          node --version
          npm --version
      - name: NPM setup
        run: npm ci
      - name: Remove commercial packages
        run: rm -rf node_modules/@bitwarden/commercial-sdk-internal
      - name: Build Chrome extension
        run: npm run build:prod:chrome
        working-directory: apps/browser
      - name: Upload loadable extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-chrome-test-${{ github.sha }}
          path: apps/browser/build
          if-no-files-found: error